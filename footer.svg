<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Animated pink waves: each layer is a 2400px-wide wave (period 600px) sliding 1200px in a seamless loop -->
  <path fill="#F8BBD0" opacity="0.9"
    d="M0 45 C150 15 450 75 600 45 C750 15 1050 75 1200 45 C1350 15 1650 75 1800 45 C1950 15 2250 75 2400 45 V120 H0 Z">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="14s" repeatCount="indefinite"/>
  </path>
  <path fill="#F06292" opacity="0.8"
    d="M0 62 C150 92 450 32 600 62 C750 92 1050 32 1200 62 C1350 92 1650 32 1800 62 C1950 92 2250 32 2400 62 V120 H0 Z">
    <animateTransform attributeName="transform" type="translate" from="-1200 0" to="0 0" dur="10s" repeatCount="indefinite"/>
  </path>
  <path fill="#C2185B"
    d="M0 82 C150 62 450 102 600 82 C750 62 1050 102 1200 82 C1350 62 1650 102 1800 82 C1950 62 2250 102 2400 82 V120 H0 Z">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="7s" repeatCount="indefinite"/>
  </path>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
